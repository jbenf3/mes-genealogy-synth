[project]
name = "mesgen"
version = "0.1.0"
description = "Deterministic synthetic MES genealogy data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.2.6",
    "pyarrow==23.0.1",
    "pyyaml==6.0.2",
    "duckdb==1.5.5",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.9"]

[project.scripts]
mesgen = "mesgen.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mesgen"]

[tool.hatch.build.targets.wheel.force-include]
"profiles" = "mesgen/profiles"
"scenarios" = "mesgen/scenarios"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# ruff's default rules, plus docstrings (D), type hints (ANN) and Returns/Raises sections (DOC)
select = ["E4", "E7", "E9", "F", "D", "ANN", "DOC"]
ignore = ["ANN401"]  # allow Any for keyword arguments that take any column
preview = true       # the DOC rules are preview-only in ruff 0.16
pydocstyle.convention = "google"
